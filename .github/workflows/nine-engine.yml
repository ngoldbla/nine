# The cheap gate. No simulator, no signing, no Xcode project generation.
#
# It exists because until PRD-20 the ONLY test invocation in CI was
# `swift test --filter 'BoardSpeechTests|AXFixtureTests'` — the 56-hash golden
# corpus that EXECUTING-A-PRD §3 calls a contract was run by hand and by nothing
# else. PRD-20 touches the enums those hashes are made of, which made it the
# wrong PRD to keep relying on remembering.
name: Engine + catalog (Nine)

on:
  pull_request:
    paths: ['nine/**', 'couchkit/**', '.github/workflows/nine-engine.yml']
  workflow_dispatch:

concurrency:
  group: nine-engine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.1
        run: |
          set -euo pipefail
          # Nine 1.2 needs the iOS 27.1 SDK (PRD-37 §5): the iPhone Duo's
          # hinge and fold APIs exist nowhere else. No fallback — a build made
          # with an older Xcode silently drops the Duo layout.
          XC=""
          for d in /Applications/Xcode_27.1*.app; do [ -e "$d" ] && XC="$d"; done
          if [ -z "$XC" ]; then
            echo "::error::Xcode 27.1 is not installed on this runner (actions/runner-images#14850). Installed:"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$XC"
          xcodebuild -version
      # The whole suite, including GoldenCorpus. ~120 s per EXECUTING-A-PRD §5.
      - name: swift test
        working-directory: nine
        run: swift test
      # The catalog checks cannot run against the repo until Task 4 creates
      # Sources/Strings/Localizable.xcstrings, and "cannot run" is how they
      # shipped with two bugs in them: `compile` invoked without the
      # `--output-directory` it requires even under `--dry-run`, and a `print`
      # parser expecting quoted keys when the tool emits bare ones. Neither was
      # reachable, so neither was caught. This drives all four paths against
      # scratch catalogs, on every PR, from today rather than from Task 4.
      - name: Self-test the catalog checks
        working-directory: nine
        run: python3 scripts/strings.py --selftest-catalog
      - name: Audit the catalog
        working-directory: nine
        run: python3 scripts/strings.py --audit
